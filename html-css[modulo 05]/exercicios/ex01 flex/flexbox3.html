<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        body{
            background-color: darkgray;
        }

        .container{
            background-color:antiquewhite ;

            display: flex;
            /*  [Declaração Normal] 
            flex-direction: row;
            flex-wrap: wrap-reverse;
            */
            /*[Declaração Simplificada] se usa flex-flow.*/
            flex-flow: row wrap-reverse;
        }

        .item{
            background-color: rgb(150, 2, 2) ;
            color: aliceblue;
            border: 2px solid white;
            padding: 5px;
            text-align: center;

            flex: auto; /* flex: auto; não funciona no pai somente no filho.*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bloco B</div>
        <div class="item">Exemplo de bloco C</div>
        <div class="item">Exemplo de bloco D</div>
        <div class="item">Exemplo de bloco E</div>
        <div class="item">Exemplo de bloco F</div>
        <div class="item">Exemplo de bloco G</div>
    </div>
</body>
</html>
