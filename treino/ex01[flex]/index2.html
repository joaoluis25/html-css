<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treino flex</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        #container{
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .caixa1{
            background-color: black;
            padding: 10px;
            color: white;
        }

        .caixa2{
            background-color: blue;
            padding: 10px;
            color: white;
        }

        .caixa3{
            background-color: red;
            padding: 10px;
            color: white;
        }

        @media screen and (max-width:600px){
            #container{
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="container">

        <div class="caixa1">
            <h2>Caixa 1</h2>
        </div>

        <div class="caixa2">
            <h2>Caixa 2</h2>
        </div>

        <div class="caixa3">
            <h2>Caixa 3</h2>
        </div>

    </div>
    
</body>
</html>
