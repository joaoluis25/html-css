<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>treino flex</title>
    <style>

        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        div{
            background-color: black;
            height: 50px;
            width: 100vw;
            padding: 15px;
        }

        .container{
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        a{
            color: white;
            text-decoration: none;  
            font-weight: bolder;
        }

        a:hover{
            background-color: white;
            color: black;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div>
            <ul class="container">
                <li><a href="#">Home</a></li>
                <li><a href="#">Sobre nós</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
    </div>
    
</body>
</html>
