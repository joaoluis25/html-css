<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media query</title>
    <style>

        /*declarações gerais*/
        *{
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body{
            width: 100vw;
            height: 100vh;
            background-color: blue;
            background-size: contain;
            background-repeat: no-repeat;
        }

        h1{
            color: aliceblue;
            text-shadow: 2px 2px 0px rgba(255, 0, 0, 0.651) ;
            padding: 10px;
        }
        /*declarações para retrato*/
        @media screen and (orientation: portrait) {

          body{
             background: url(img/cev-portrait.jpg);
             background-position: center bottom;
             background-repeat: no-repeat;
             background-size: contain;
           }

        }

        /*declarações para paisagem*/
        @media screen and (orientation: landscape) { 
            body{
              background: url(img/cev-landscape.jpg);
              background-position: center center;
              background-repeat: no-repeat;
              background-size: contain;
            }          
        }

    </style>
</head>
<body>
    <h1>Mude a orientação do seu celular!</h1>
    
</body>
</html>
