<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            background-color: darkgray;

            display: flex;
            flex-flow: row wrap;

            height: 400px;
        }

        .item{
            border: 2px solid black;
            color: aliceblue;
            background-color: brown;
            padding: 20px;
            text-align: center;
        }

        #i1{
            align-self: auto;
        }
         #i2{
            align-self: flex-start;
        }
         #i3{
            align-self: flex-end;
        }
         #i4{
            align-self: center;
        }
         #i5{
            align-self: stretch;
        }

    
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
    </div>
    
</body>
</html>
