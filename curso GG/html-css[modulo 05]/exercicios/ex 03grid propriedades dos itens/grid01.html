<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid layout</title>
    <style>
        .container{
            border: 2px solid blue;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
        }

        .caixa1{
            border: 3px solid darkred;
            text-align: center;
            padding: 5px;
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start:1 ;
            grid-column-end: 3;
        }

        .caixa2{
            border: 3px solid darkgoldenrod;
            text-align: center;
            padding: 5px;
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 3;
            grid-column-end: 5;

        }

        .caixa3{
            border: 3px solid darkgreen;
            padding: 5px;
            text-align: center;
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: -1;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa 2</div>
        <div class="caixa3">Caixa 3</div>
    
</body>
</html>
