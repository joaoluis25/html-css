<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens de Fundo</title>
    <style>
        body{
            background-color: black;
            background-image: url("imagens/download.jpg");
        }
        div.quadrado{
            border: 1px solid rgba(248, 0, 0, 0.726);
            background-color: azure;
            display: inline-block;
            padding: 5px;
            width: 300px;
            height: 300px;
            border-radius: 10px;
        }
        .circle{
            width: 100px;
            height: 100px;
            background-color: blue; /* Ou qualquer cor desejada */
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        #q1{
            background-color: rgb(255, 255, 255);
            margin-bottom: 50px;
            width: 300px;
            height: 300px;
            background-color: lightgray;
            display: inline-flex;
            justify-content: center;
             align-items: center

        }
        #q2{
            background-color: rgb(34, 141, 235);
            margin: 10px 75px 0px 10px;
        }
        #q3{        
            background: url("imagens/pattern003.png");
          
        }
        #q4{
            background-image: linear-gradient(to top, red,yellow);
            margin-left: 410px;
            margin-top: 100px;
        }

    </style>
</head>
<body>
    <div id="q1">
        <div class="circle"></div>
    </div>
    <div class="quadrado" id="q2">

    </div>
    <div class="quadrado" id="q3">

    </div>
    <div class="quadrado" id="q4">

    </div>

</body>
</html>
