<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
    <style>
        #container{
            background-image: url("target001.png");
            background-size: 100% 100%;
            position: relative;
            background-color: purple;
            height: 98vh;
            padding: 10px;
        }

        #conteudo{
            position: absolute;
            background-image: url("target001.png");
            background-size: 100% 100%;
            background-color: yellow;
            height: 200px;
            width: 300px;
            /*se vc quiser colocar o conteudo no centro do quadrado podesse usar a declaração margin:auto;, mas ele somente serve para o elemento horizontal.*/
            
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%); /*centralizou o conteudo no centro do container, binque com os valores pode ser px ou %. Mexe com valores tanto verticais quanto horizontais.*/
            
        }

    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
