<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 300px;
            border-collapse: collapse;
        }

        td{
            border: 2px solid black;
            padding: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr> <!--Primeira linha-->
            <td rowspan="3">A1</td>
            <td>B1</td>
            <td>C3</td>
        </tr>
        <tr> <!--Segunda linha-->
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>B3</td>
            <td rowspan="3">C3</td> <!--rowspan para baixo-->
        </tr>
        <tr>
            <td>A4</td>
            <td>B4 </td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B6</td>
        </tr>
        <tr>
            <td colspan="3">A6</td> <!--colspan para o lado-->
        </tr>
    </table>
</body>
</html>
