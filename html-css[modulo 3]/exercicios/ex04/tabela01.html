<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
        body{
            background-color: rgb(88, 88, 88);
        }
        table{
            width: 500px;
            height: 400px;
            border-collapse:collapse; /*retira o espaço entre as linhas e colunas da tabela*/
            border: 5px solid orange;
        }
        td{
            padding-left: 6px;
            padding-top: 7px;
            padding-right: 5px;
            border: 1px solid rgb(255, 253, 253);
            text-align: center;/*Alinhamento horizontal*/
            vertical-align: middle;/*se usa para alinhamentos verticais como biddle, boottom e top*/
        }
        .linha{
            background-color: rgba(165, 42, 42, 0.5);
        }
        .dado{
            background-color: rgba(177, 177, 16, 0.623);
        }
        .numero{ /*pode se usar configurações esclusivas de alinhamento com classes*/
            text-align: right;
            background-color: rgba(137, 43, 226, 0.514);
        }
        h1{ /*colocando contorno ao redor das letras, essa formatação so é valida para navegadores chrome e safari.*/
            -webkit-text-stroke-width: 1px;
            -webkit-text-stroke-color: orange;
        }
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>
    <table>
        <tr> <!--Primeira linha-->
            <td>A1</td>
            <td class="numero">400</td>
            <td>C3</td>
        </tr>
        <tr class="linha"> <!--Segunda linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td class="dado">A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="dado">B4 </td>
            <td>C4</td>
        </tr>
        <tr>
            <td class="dado">A5</td>
            <td>B6</td>
        </tr>
        <tr>
            <td>A6</td>
        </tr>
    </table>
</body>
</html>
